<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Tuấn - Business Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-gold: #d4af37;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0f0f0f 100%);
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        /* Họa tiết sang trọng chìm */
        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.1;
            pointer-events: none;
        }
        .profile-img {
            width: 100px; height: 100px;
            background: linear-gradient(45deg, #d4af37, #f9f295);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            color: #000;
            margin: 0 auto 20px;
            border: 3px solid #333;
        }
        h1 { margin: 10px 0; font-size: 24px; letter-spacing: 1px; }
        .tags { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .tag {
            background: rgba(212, 175, 55, 0.1);
            color: var(--accent-gold);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid var(--accent-gold);
            text-transform: uppercase;
        }
        .section-title {
            text-align: left;
            font-size: 13px;
            color: var(--text-dim);
            margin: 20px 0 10px 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .link-card {
            background: #252525;
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .link-card:hover {
            border-color: var(--accent-gold);
            background: #2d2d2d;
            transform: translateY(-2px);
        }
        .link-card i {
            width: 30px; font-size: 20px; color: var(--accent-gold);
            margin-right: 15px;
        }
        .link-info { text-align: left; }
        .link-info span { display: block; font-size: 14px; font-weight: 600; }
        .link-info small { color: var(--text-dim); font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-img">TT</div>
        <h1>THANH TUẤN</h1>
        <div class="tags">
            <span class="tag">Kinh doanh</span>
            <span class="tag">Doanh nghiệp</span>
        </div>

        <div class="section-title">Kết nối doanh nghiệp</div>
        <a href="https://zalo.me/0989777649" class="link-card">
            <i class="fa-solid fa-briefcase"></i>
            <div class="link-info">
                <span>Zalo Doanh Nghiệp</span>
                <small>0989.777.649</small>
            </div>
        </a>

        <a href="mailto:Dariusnguyen235@gmail.com" class="link-card">
            <i class="fa-solid fa-envelope"></i>
            <div class="link-info">
                <span>Email Trực Tuyến</span>
                <small>Dariusnguyen235@gmail.com</small>
            </div>
        </a>

        <div class="section-title">Liên hệ cá nhân</div>
        <a href="tel:0865585833" class="link-card">
            <i class="fa-solid fa-phone"></i>
            <div class="link-info">
                <span>Số Điện Thoại Cá Nhân</span>
                <small>0865.585.833</small>
            </div>
        </a>

        <a href="https://www.facebook.com/profile.php?id=100028249071536" class="link-card">
            <i class="fa-brands fa-facebook"></i>
            <div class="link-info">
                <span>Facebook Profile</span>
                <small>Kết nối trực tiếp</small>
            </div>
        </a>

        <a href="https://wa.me/0989777649" class="link-card">
            <i class="fa-brands fa-whatsapp"></i>
            <div class="link-info">
                <span>WhatsApp</span>
                <small>Thank Your</small>
            </div>
        </a>
    </div>
</body>
</html>
