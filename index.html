<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Tuấn - Premium Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0; padding: 0;
            background: #050505;
            background-image: linear-gradient(135deg, #0f0f0f 0%, #050505 100%);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 420px;
            padding: 40px 20px;
            text-align: center;
        }
        /* Avatar Chuyên Nghiệp */
        .profile-wrapper {
            position: relative;
            width: 130px; height: 130px;
            margin: 0 auto 20px;
        }
        .profile-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        h1 { font-size: 26px; letter-spacing: 2px; margin-bottom: 5px; color: #d4af37; text-transform: uppercase; }
        .tag-container { margin-bottom: 30px; }
        .tag {
            font-size: 11px; font-weight: bold;
            border: 1px solid #d4af37; color: #d4af37;
            padding: 4px 15px; border-radius: 30px;
            text-transform: uppercase; margin: 0 5px;
        }
        .section-label {
            text-align: left; font-size: 11px; color: #888;
            margin: 25px 0 10px 10px; letter-spacing: 3px; text-transform: uppercase;
        }
        /* Thẻ liên kết kiểu Kính Mờ */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
            padding: 18px;
            border-radius: 18px;
            display: flex; align-items: center;
            text-decoration: none; color: #fff;
            transition: all 0.4s ease;
        }
        .card:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: #d4af37;
            transform: scale(1.02);
        }
        .card i { font-size: 22px; color: #d4af37; margin-right: 20px; width: 25px; }
        .card-info { text-align: left; }
        .card-info b { display: block; font-size: 15px; margin-bottom: 2px; }
        .card-info span { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-wrapper">
            <!-- Thay avatar.jpg bằng tên ảnh bạn đã tải lên -->
            <img src="avatar.jpg" alt="Thanh Tuấn" class="profile-img">
        </div>
        <h1>THANH TUẤN</h1>
        <div class="tag-container">
            <span class="tag">Kinh doanh</span>
            <span class="tag">Doanh nghiệp</span>
        </div>

        <div class="section-label">Business Connect</div>
        <a href="https://zalo.me/0989777649" class="card">
            <i class="fa-solid fa-briefcase"></i>
            <div class="card-info">
                <b>Zalo Doanh Nghiệp</b>
                <span>0989.777.649</span>
            </div>
        </a>
        <a href="mailto:Dariusnguyen235@gmail.com" class="card">
            <i class="fa-solid fa-envelope-open-text"></i>
            <div class="card-info">
                <b>Email Trực Tuyến</b>
                <span>Dariusnguyen235@gmail.com</span>
            </div>
        </a>

        <div class="section-label">Personal Contact</div>
        <a href="tel:0865585833" class="card">
            <i class="fa-solid fa-phone-volume"></i>
            <div class="card-info">
                <b>Số Điện Thoại Cá Nhân</b>
                <span>0865.585.833</span>
            </div>
        </a>
        <a href="https://www.facebook.com/profile.php?id=100028249071536" class="card">
            <i class="fa-brands fa-facebook-f"></i>
            <div class="card-info">
                <b>Facebook Profile</b>
                <span>Kết nối trực tiếp</span>
            </div>
        </a>
        <a href="https://wa.me/0989777649" class="card">
            <i class="fa-brands fa-whatsapp"></i>
            <div class="card-info">
                <b>WhatsApp</b>
                <span>International Support</span>
            </div>
        </a>
    </div>
</body>
</html>
